<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arduino UNO - Exploded View</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5fb;--ink:#14213a;--mut:#51627f;--card:#fff;--line:#c6d3e6;--acc:#d97f00;--teal:#0b8a80;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1524;--ink:#eaf0fa;--mut:#9db0cc;--card:#122238;--line:#2a4466;--acc:#ffb703;--teal:#2ec4b6}}
:root[data-theme="dark"]{--bg:#0a1524;--ink:#eaf0fa;--mut:#9db0cc;--card:#122238;--line:#2a4466;--acc:#ffb703;--teal:#2ec4b6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;padding:18px 14px 40px}
html[lang=bn] body{font-family:'Hind Siliguri',system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{font-size:clamp(22px,4vw,34px);line-height:1.15}
.sub{color:var(--mut);font-size:14px;margin-top:6px;max-width:62ch;line-height:1.5}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{background:transparent;color:var(--ink);padding:8px 16px}
.seg button[aria-pressed=true]{background:var(--acc);color:#1a1200}
button,select{font:inherit;font-size:14px;font-weight:600;border-radius:99px;cursor:pointer}
button{border:0;padding:10px 18px;background:var(--acc);color:#1a1200}
button.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
select{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:9px 12px}
button:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;overflow:hidden}
.stage.ring{height:var(--sh);padding:0;touch-action:pan-y;background:radial-gradient(60% 70% at 50% 50%,color-mix(in srgb,var(--acc) 14%,var(--card)),var(--card))}
.bw{position:relative;width:min(100%,760px);margin:0 auto 22px}
.stage.ring .bw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--bwid);margin:0}
.bw img{display:block;width:100%;border-radius:10px;transition:filter .7s;user-select:none;-webkit-user-drag:none}
.stage.ex .bw img{filter:brightness(.55) saturate(.65)}
.mk{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--acc);color:#1a1200;font-size:10px;font-weight:700;display:grid;place-items:center;opacity:0;transition:opacity .4s .5s,transform .2s;z-index:3}
.stage.ring .mk{width:16px;height:16px;margin:-8px 0 0 -8px;font-size:8px}
.stage.ex .mk{opacity:1}
.mk.hl{transform:scale(1.6);z-index:6}
svg.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
svg.ln line{stroke:var(--acc);stroke-width:1;opacity:0;transition:opacity .5s .6s}
.stage.ex svg.ln line{opacity:.26}
.stage.ring.ex svg.ln line{opacity:.14}
svg.ln line.hl{opacity:1!important;stroke-width:2}
.piece{position:absolute;background-size:100% 100%;z-index:4;transition:left .9s cubic-bezier(.3,.8,.25,1),top .9s cubic-bezier(.3,.8,.25,1),width .9s cubic-bezier(.3,.8,.25,1),height .9s cubic-bezier(.3,.8,.25,1),box-shadow .3s;transition-delay:var(--dl,0s);pointer-events:none}
.stage.nt .piece{transition:none}
.stage.ex .piece{box-shadow:0 6px 16px rgba(0,0,0,.4);border-radius:3px}
.stage.ring.ex .piece{pointer-events:auto;cursor:pointer;outline:1px solid rgba(255,255,255,.25)}
.piece.hl{outline:3px solid var(--acc)!important;z-index:7}
.nb{display:none;position:absolute;top:-8px;left:-8px;width:16px;height:16px;border-radius:50%;background:var(--acc);color:#1a1200;font-size:9px;font-weight:700;place-items:center;line-height:1}
.stage.ring.ex .nb{display:grid}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;position:relative;z-index:1}
.stage.ring .grid{display:none}
.slot{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:96px;transition:border-color .2s,background .2s;cursor:pointer}
.slot.hl{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.th{flex:none;width:104px;height:74px}
.tx{min-width:0}
.tx b{display:block;font-size:14px;line-height:1.3}
.tx b i{font-style:normal;display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--acc);color:#1a1200;font-size:10px;margin-inline-end:6px;vertical-align:1px}
.tx p{color:var(--mut);font-size:12.5px;line-height:1.5;margin-top:3px}
.info{display:flex;gap:14px;align-items:center;min-height:92px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.info img{flex:none;max-width:110px;max-height:70px;border-radius:6px}
.info b{display:block;font-size:16px;line-height:1.3}
.info p{color:var(--mut);font-size:14px;line-height:1.5;margin-top:3px}
.note{color:var(--mut);font-size:12.5px;margin-top:14px;line-height:1.5}
@media (prefers-reduced-motion:reduce){.piece{transition-duration:.01s}}
</style>
</head>

const N=D.length,RW=R[2]-R[0],BCX=(R[0]+R[2])/2,BCY=(R[1]+R[3])/2,$=id=>document.getElementById(id);
